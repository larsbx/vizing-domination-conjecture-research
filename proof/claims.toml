# Claim registry for Vizing domination conjecture research.
# This file is intentionally conservative. Thread-derived results begin as
# `working` until they are reproduced by checked-in code, data, and receipts.

[meta]
namespace = "VDC"
status_values = ["conjectural", "working", "computed", "proved", "retracted"]

[[claim]]
id = "VDC-MAIN"
title = "Vizing domination conjecture"
status = "conjectural"
statement = "For finite graphs G and H, gamma(G square H) >= gamma(G) gamma(H)."
authority = "external/open_problem"
notes = "This repository studies computational and structural fragments; it does not claim the conjecture."

[[claim]]
id = "VDC-G4-SQUARE-STRICT-N10"
title = "Strict square surplus for the n=10, gamma=4 census"
status = "working"
statement = "For every n=10 graph G in the gamma(G)=4 census, gamma(G square G) > 16."
authority = "thread_record_pending_reproduction"
notes = "Thread audit reports 491 graph6 entries collapsing to 470 isomorphism classes. Needs checked-in census, deduplication code, and replayable audit receipts."

[[claim]]
id = "VDC-ROW-CSP"
title = "Row-state CSP formulation for domination in Cartesian products"
status = "working"
statement = "A product dominating set in G square H can be represented by row states S_h with residual constraints R_G(S_h) subset union_{h'~h} S_{h'}."
authority = "mathematical_argument_pending_formal_writeup"
notes = "This is the core finite CSP representation used by the audit framework."

[[claim]]
id = "VDC-WING-PAIR"
title = "Wing-pair residual-capacity lemma"
status = "working"
statement = "For finite simple graphs G,H and distinct row vertices w1,w2 satisfying N_H(w1)={w2,o1}, N_H(w2)={w1,o2}, with o1,o2 outside {w1,w2}, every dominating set in G square H satisfies |R_G(S_w1) minus S_w2| <= a_o1 and |R_G(S_w2) minus S_w1| <= a_o2, where R_G(S)=V(G) minus N_G[S] and a_h=|S_h|. If no pair of wing states of the prescribed sizes satisfies both inequalities, that exact size pattern is infeasible. Survival does not certify global feasibility."
authority = "repository_proof_draft_pending_review_and_regression"
proof_record = "proof/wing-pair.md"
notes = "Corpus-independent proof and applicability/failure examples are recorded. Outer rows may coincide; the proof record also derives the shared-row union-capacity condition. Small direct-product conformance checks are non-authoritative. Status remains working: proof review, authoritative census provenance (#2), canonical row-CSP runner (#4), and replayable regression against that runner are pending. Issue #5 remains partially delivered; no census or strict-surplus claim is promoted."

[[claim]]
id = "VDC-CASEBASE-3"
title = "Corrected case base has three isomorphism classes"
status = "working"
statement = "The prior 16 graph6-entry case base collapses to three isomorphism classes: A, one A-class representative, and B."
authority = "thread_record_pending_reproduction"
notes = "The separately recovered historical 16-entry case base now replays as three classes (conformance/receipts/casebase_identity.json). The original aclass_target.json, recovered on 2026-10-06, exactly matches the numbered historical log and decoded structural metadata. Remains working: the authoritative ordered 491-entry census, its 21 duplicate rows, and case-base census membership are still missing; issue #2's promotion gate has not been met. See docs/audits/census-provenance-gap-2026-10-05.md."

[[claim]]
id = "VDC-OPERATOR-NEGATIVE"
title = "Four simple reverse operators do not cover the census"
status = "working"
statement = "Reverse pendant, subdivision, true-twin, and false-twin moves at depth <= 4 reduce only the case-base entries to the case base, not the rest of the census."
authority = "thread_record_pending_reproduction"
notes = "This downgrades the PSC-style operator-closure path to a diagnostic and lemma-mining branch."

[[claim]]
id = "VDC-GOLD-AUDIT-ARCH"
title = "Three-mechanism gold audit architecture"
status = "working"
statement = "The audit stack lambda-bound -> structural lemmas -> row-CSP residue is the current main executable proof architecture."
authority = "research_program_design"
notes = "Needs canonical implementation and explicit receipt format before it can support computed claims."
